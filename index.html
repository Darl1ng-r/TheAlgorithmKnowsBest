<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="An asymmetrical cybernetic cognitive experiment. Answer five rapid dilemmas to receive calculated anti-recommendation friction."
    />
    <meta name="keywords" content="y2k, cyber-brutalist, taste algorithm, anti-recommendation, web game, spec sheet" />
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="THE ALGORITHM KNOWS BEST // 2026" />
    <meta property="og:description" content="Based on your biological preferences, mathematics has determined that you are wrong." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Syne (Ultra Bold Modular Techno), Space Grotesk (Tech Wide), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('the_algo_theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
