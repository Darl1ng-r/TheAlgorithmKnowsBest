<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark brutalist specimen tile -->
  <rect width="64" height="64" rx="10" fill="#0B0F19" />
  
  <!-- Hairline technical border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="8.5" fill="none" stroke="#252D3D" stroke-width="2" />
  
  <!-- High-contrast outer target ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#F8FAFC" stroke-width="3.5" />
  
  <!-- Registration crosshair axis lines -->
  <line x1="32" y1="6" x2="32" y2="21" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />
  <line x1="32" y1="43" x2="32" y2="58" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />
  <line x1="6" y1="32" x2="21" y2="32" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />
  <line x1="43" y1="32" x2="58" y2="32" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />
  
  <!-- Signal Red Core Diagnostic Indicator -->
  <circle cx="32" cy="32" r="7.5" fill="#E61E2A" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  
  <!-- Cybernetic Corner Registration Brackets -->
  <path d="M 8 16 V 8 H 16" fill="none" stroke="#E61E2A" stroke-width="2.5" />
  <path d="M 48 8 H 56 V 16" fill="none" stroke="#E61E2A" stroke-width="2.5" />
  <path d="M 8 48 V 56 H 16" fill="none" stroke="#E61E2A" stroke-width="2.5" />
  <path d="M 48 56 H 56 V 48" fill="none" stroke="#E61E2A" stroke-width="2.5" />
</svg>